<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Controles - RUSSO Electrónica</title>
  <meta name="description" content="Buscador de controles remotos para clientes de RUSSO Electrónica">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="encabezado">
    <strong>RUSSO Electrónica</strong> &nbsp;|&nbsp; Santiago 3462, Rosario<br>
    WhatsApp: <a href="https://wa.me/543415851441">3415851441</a>
  </div>

  <main class="contenedor">
    <form class="login" id="formLogin" novalidate>
      <h1>Buscador de Controles</h1>
      <p class="nota">Ingresá con tu DNI para buscar el control de cada TV o aire.</p>

      <label for="dni">Tu DNI (sin puntos)</label>
      <input class="campo" id="dni" name="dni" type="text" inputmode="numeric"
             autocomplete="username" placeholder="Ej: 30123456" required>

      <button class="boton" type="submit" id="botonIngresar">Ingresar</button>
      <p class="mensaje" id="mensaje" role="alert" hidden></p>
    </form>
  </main>

  <script src="/login.js"></script>
</body>
</html>
